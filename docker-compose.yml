services:
  selenoid:
    image: aerokube/selenoid:1.11.3
    container_name: selenoid
    networks:
      - selenoid-network
    ports:
      - "4444:4444"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/jenkins_home/workspace/selenoid/selenoid/browsers.json:/etc/selenoid/browsers.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      -conf /etc/selenoid/browsers.json
      -limit 5
      -container-network selenoid-network

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tests
    networks:
      - selenoid-network
    depends_on:
      - selenoid
    environment:
      SELENOID_URL: http://selenoid:4444/wd/hub
    volumes:
      - maven-repo:/root/.m2
      - /var/jenkins_home/workspace/selenoid/target:/app/target

networks:
  selenoid-network:
    name: selenoid-network
    driver: bridge

volumes:
  maven-repo: